<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 192 192" width="192" height="192">
  <defs>
    <linearGradient id="tfGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4f46e5"/>
      <stop offset="50%" stop-color="#7c3aed"/>
      <stop offset="100%" stop-color="#ec4899"/>
    </linearGradient>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#18181B"/>
      <stop offset="100%" stop-color="#09090B"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background rounded rect -->
  <rect width="192" height="192" rx="42" fill="url(#bgGrad)" stroke="#27272A" stroke-width="3"/>

  <!-- Glowing background orb -->
  <circle cx="96" cy="96" r="48" fill="#6366f1" opacity="0.2" filter="url(#glow)"/>

  <!-- TeamForge 3-Layer Prism Icon -->
  <g transform="translate(40, 40) scale(1.18)" fill="none" stroke="url(#tfGrad)" stroke-width="7" stroke-linecap="round" stroke-linejoin="round">
    <!-- Top Layer (Rhombus) -->
    <path d="M48 8 L84 26 L48 44 L12 26 Z" fill="#6366f1" fill-opacity="0.25"/>
    <!-- Middle Layer -->
    <path d="M12 48 L48 66 L84 48"/>
    <!-- Bottom Layer -->
    <path d="M12 70 L48 88 L84 70"/>
  </g>
</svg>
